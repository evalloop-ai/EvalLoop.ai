<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — EvalLoop AI</title>
  <meta
    name="description"
    content="Sign in to your EvalLoop AI account."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #101211;
      --panel: #171b18;
      --panel2: #1d221f;
      --ink: #f1f1ef;
      --muted: #a4aaa6;
      --dim: #727974;
      --line: rgba(241, 241, 239, 0.14);
      --line-soft: rgba(241, 241, 239, 0.08);
      --green: #3ecf8e;
      --green2: #85e7ba;
      --darkgreen: #13261c;
      --sans:
        "Inter",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      --mono: "DM Mono", monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(62, 207, 142, 0.075),
          transparent 35%
        ),
        var(--bg);
      display: flex;
      flex-direction: column;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button,
    input {
      font: inherit;
    }
    /* =========================================
       BACKGROUND
       ========================================= */
    .background-grid {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(241, 241, 239, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(241, 241, 239, 0.025) 1px,
          transparent 1px
        );
      background-size: 48px 48px;
      mask-image:
        linear-gradient(
          to bottom,
          black 0%,
          rgba(0, 0, 0, 0.55) 55%,
          transparent 100%
        );
    }
    .background-glow {
      position: fixed;
      width: 700px;
      height: 700px;
      left: 50%;
      top: -500px;
      transform: translateX(-50%);
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(
          circle,
          rgba(62, 207, 142, 0.085),
          transparent 68%
        );
      filter: blur(10px);
    }
    /* =========================================
       HEADER
       ========================================= */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 76px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(16, 18, 17, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .nav-inner {
      width: min(calc(100% - 48px), 1200px);
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }
    .brand {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.04em;
    }
    .brand-cursor {
      color: var(--green);
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%,
      45% {
        opacity: 1;
      }
      46%,
      100% {
        opacity: 0.25;
      }
    }
    .back {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--muted);
      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }
    .back:hover {
      color: var(--green2);
      transform: translateX(-2px);
    }
    /* =========================================
       MAIN
       ========================================= */
    main {
      flex: 1;
      width: min(calc(100% - 48px), 1200px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 90px 0 110px;
    }
    .auth-wrapper {
      width: 100%;
      max-width: 460px;
    }
    .kicker {
      margin-bottom: 18px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 28px;
      letter-spacing: 0.08em;
      color: var(--green2);
    }
    h1 {
      font-size: clamp(52px, 7vw, 78px);
      font-weight: 300;
      line-height: 0.92;
      letter-spacing: -0.055em;
      margin-bottom: 42px;
    }
    h1 span {
      color: var(--green);
    }
    /* =========================================
       AUTH PANEL
       ========================================= */
    .auth-panel {
      border: 1px solid var(--line);
      background: rgba(23, 27, 24, 0.82);
      padding: 34px;
    }
    .field {
      margin-bottom: 22px;
    }
    .field-label {
      display: block;
      margin-bottom: 9px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .field input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      color: var(--ink);
      background: rgba(16, 18, 17, 0.85);
      border: 1px solid var(--line);
      outline: none;
      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }
    .field input::placeholder {
      color: var(--dim);
    }
    .field input:focus {
      border-color: rgba(62, 207, 142, 0.6);
      background: rgba(16, 18, 17, 1);
    }
    .submit-button {
      width: 100%;
      height: 52px;
      margin-top: 4px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #0e1712;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }
    .submit-button:hover {
      background: var(--green2);
      transform: translateY(-1px);
    }
    .auth-switch {
      margin-top: 25px;
      padding-top: 24px;
      border-top: 1px solid var(--line-soft);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .auth-switch a {
      margin-left: 5px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--green2);
    }
    .auth-switch a:hover {
      color: var(--green);
    }
    /* =========================================
       FOOTER
       ========================================= */
    footer {
      border-top: 1px solid var(--line-soft);
    }
    .footer-inner {
      width: min(calc(100% - 48px), 1200px);
      min-height: 58px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }
    /* =========================================
       MOBILE
       ========================================= */
    @media (max-width: 640px) {
      .nav-inner,
      .footer-inner {
        width: calc(100% - 32px);
      }
      .nav-inner {
        min-height: 68px;
      }
      .site-header {
        min-height: 68px;
      }
      .back {
        font-size: 8px;
      }
      main {
        width: calc(100% - 32px);
        padding: 75px 0 90px;
      }
      .auth-panel {
        padding: 25px 20px;
      }
      h1 {
        font-size: 56px;
        margin-bottom: 34px;
      }
      .footer-inner {
        min-height: 70px;
        flex-direction: column;
        justify-content: center;
        gap: 7px;
        text-align: center;
      }
    }
    @media (max-width: 420px) {
      .brand {
        font-size: 15px;
      }
      .back {
        font-size: 7px;
      }
      h1 {
        font-size: 50px;
      }
      .auth-panel {
        padding: 22px 17px;
      }
    }
  </style>
</head>
<body>
  <div class="background-grid"></div>
  <div class="background-glow"></div>
  <!-- =========================================
       HEADER
       ========================================= -->
  <header class="site-header">
    <div class="nav-inner">
      <a
        href="/"
        class="brand"
        aria-label="EvalLoop AI"
      >
        EvalLoop AI<span class="brand-cursor">_</span>
      </a>
      <a
        href="/"
        class="back"
      >
        ← BACK TO EVALLOOP AI
      </a>
    </div>
  </header>
  <!-- =========================================
       MAIN
       ========================================= -->
  <main>
    <section
      class="auth-wrapper"
      aria-labelledby="login-title"
    >
      <div class="kicker">
        AUTHENTICATION
      </div>
      <h1 id="login-title">
        Sign in<span>.</span>
      </h1>
      <div class="auth-panel">
        <form id="loginForm">
          <div class="field">
            <label
              class="field-label"
              for="email"
            >
              EMAIL
            </label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="field">
            <label
              class="field-label"
              for="password"
            >
              PASSWORD
            </label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>
          <button
            type="submit"
            class="submit-button"
          >
            SIGN IN →
          </button>
        </form>
        <div class="auth-switch">
          Don't have an account?
          <a href="/signup/">
            CREATE ACCOUNT →
          </a>
        </div>
      </div>
    </section>
  </main>
  <!-- =========================================
       FOOTER
       ========================================= -->
  <footer>
    <div class="footer-inner">
      <span>© 2026 EvalLoop AI</span>
      <span>BUILT FOR BETTER AI</span>
      <span>HYDERABAD · INDIA</span>
    </div>
  </footer>
  <!-- =========================================
       TEMPORARY UI-ONLY FORM HANDLER
       ========================================= -->
  <script>
    document
      .getElementById("loginForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();
        alert(
          "Authentication is not connected yet. This page is currently UI-only."
        );
      });
  </script>
</body>
</html>
