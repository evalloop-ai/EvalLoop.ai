<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — EvalLoop AI</title>
  <meta
    name="description"
    content="Create your EvalLoop AI workspace."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #101211;
      --panel: #171b18;
      --panel2: #1d221f;
      --ink: #f1f1ef;
      --muted: #a4aaa6;
      --dim: #727974;
      --line: rgba(241, 241, 239, 0.14);
      --line-soft: rgba(241, 241, 239, 0.08);
      --green: #3ecf8e;
      --green2: #85e7ba;
      --darkgreen: #13261c;
      --sans: "Inter", system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "DM Mono", monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(62, 207, 142, 0.075),
          transparent 35%
        ),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      overflow-x: hidden;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button,
    input {
      font: inherit;
    }
    /* =========================================
       BACKGROUND
       ========================================= */
    .background-grid {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(241, 241, 239, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(241, 241, 239, 0.025) 1px,
          transparent 1px
        );
      background-size: 48px 48px;
      mask-image: linear-gradient(
        to bottom,
        black 0%,
        rgba(0, 0, 0, 0.55) 55%,
        transparent 100%
      );
    }
    .background-glow {
      position: fixed;
      width: 700px;
      height: 700px;
      left: 50%;
      top: -500px;
      transform: translateX(-50%);
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(
          circle,
          rgba(62, 207, 142, 0.085),
          transparent 68%
        );
      filter: blur(10px);
    }
    /* =========================================
       HEADER
       ========================================= */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 90;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(16, 18, 17, 0.78);
      backdrop-filter: blur(16px);
    }
    .nav-inner {
      width: min(calc(100% - 48px), 1200px);
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }
    .brand {
      display: inline-flex;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 17px;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }
    .brand-cursor {
      color: var(--green);
      animation:
        cursorBlink 1s steps(1, end) infinite;
    }
    @keyframes cursorBlink {
      0%,
      45% {
        opacity: 1;
      }
      46%,
      100% {
        opacity: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand-cursor {
        animation: none;
        opacity: 1;
      }
    }
    .back {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      transition: color 0.25s ease;
    }
    .back:hover {
      color: var(--green2);
    }
    /* =========================================
       MAIN
       ========================================= */
    main {
      width: min(calc(100% - 48px), 1200px);
      margin: 0 auto;
      padding: 95px 0 120px;
      min-height: calc(100vh - 136px);
      display: flex;
      justify-content: center;
    }
    .auth-container {
      width: 100%;
      max-width: 620px;
    }
    /* =========================================
       HERO
       ========================================= */
    .kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--green2);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.10em;
    }
    .kicker-line {
      width: 28px;
      height: 1px;
      background: var(--green);
    }
    h1 {
      margin-top: 24px;
      font-size: clamp(58px, 9vw, 105px);
      line-height: 0.9;
      font-weight: 300;
      letter-spacing: -0.05em;
    }
    h1 span {
      color: var(--green);
    }
    .intro {
      max-width: 620px;
      margin-top: 30px;
      color: var(--muted);
      font-size: 17px;
      font-weight: 300;
      line-height: 1.8;
    }
    /* =========================================
       AUTH SECTION
       ========================================= */
    .auth-section {
      margin-top: 50px;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }
    .auth-section-header {
      min-height: 54px;
      padding: 18px 22px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(23, 27, 24, 0.58);
      color: var(--green2);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.10em;
    }
    /* =========================================
       SOCIAL PROVIDERS
       ========================================= */
    .provider-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }
    .provider-button {
      min-height: 64px;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(23, 27, 24, 0.58);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition:
        background 0.25s ease,
        color 0.25s ease;
    }
    .provider-button:hover {
      background: var(--panel);
      color: var(--green2);
    }
    .provider-logo {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }
    /* =========================================
       OR
       ========================================= */
    .or-row {
      min-height: 54px;
      padding: 0 22px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .or-line {
      height: 1px;
      flex: 1;
      background: var(--line-soft);
    }
    .or-text {
      color: var(--dim);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.10em;
    }
    /* =========================================
       FORM
       ========================================= */
    .auth-form {
      border-right: 1px solid var(--line);
    }
    .field {
      padding: 17px 22px 13px;
      border-bottom: 1px solid var(--line);
      background: rgba(23, 27, 24, 0.42);
    }
    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.10em;
    }
    .field input {
      width: 100%;
      height: 32px;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 300;
    }
    .field input::placeholder {
      color: var(--dim);
    }
    .field input:focus {
      color: var(--green2);
    }
    .submit-row {
      padding: 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(23, 27, 24, 0.58);
    }
    .submit-button {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #0e1712;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition:
        background 0.25s ease,
        transform 0.25s ease;
    }
    .submit-button:hover {
      background: var(--green2);
      transform: translateY(-2px);
    }
    /* =========================================
       SWITCH
       ========================================= */
    .auth-switch {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.07em;
    }
    .auth-switch a {
      color: var(--green2);
      transition: color 0.25s ease;
    }
    .auth-switch a:hover {
      color: var(--green);
    }
    /* =========================================
       FOOTER
       ========================================= */
    footer {
      border-top: 1px solid var(--line-soft);
      padding: 22px 0;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.05em;
    }
    .footer-inner {
      width: min(calc(100% - 48px), 1200px);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }
    /* =========================================
       TABLET
       ========================================= */
    @media (max-width: 700px) {
      main {
        padding-top: 80px;
      }
      .provider-grid {
        grid-template-columns: 1fr;
      }
      .provider-button {
        border-right: 1px solid var(--line);
      }
    }
    /* =========================================
       MOBILE
       ========================================= */
    @media (max-width: 600px) {
      .nav-inner,
      main,
      .footer-inner {
        width: min(calc(100% - 32px), 1200px);
      }
      .nav-inner {
        min-height: 66px;
      }
      .brand {
        font-size: 15px;
      }
      .back {
        font-size: 8px;
      }
      main {
        padding: 70px 0 90px;
      }
      h1 {
        font-size: clamp(52px, 16vw, 78px);
      }
      .intro {
        font-size: 15px;
      }
      .auth-section {
        margin-top: 42px;
      }
      .auth-section-header,
      .or-row,
      .field,
      .submit-row {
        padding-left: 17px;
        padding-right: 17px;
      }
      .auth-switch {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .footer-inner {
        flex-direction: column;
        gap: 10px;
      }
    }
    /* =========================================
       VERY SMALL DEVICES
       ========================================= */
    @media (max-width: 380px) {
      .nav-inner,
      main,
      .footer-inner {
        width: calc(100% - 28px);
      }
      .back {
        font-size: 7px;
      }
      .provider-button {
        font-size: 8px;
      }
    }
    /* =========================================
       REDUCED MOTION
       ========================================= */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before {
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="background-grid"></div>
  <div class="background-glow"></div>
  <!-- =========================================
       HEADER
       ========================================= -->
  <header class="site-header">
    <div class="nav-inner">
      <a
        href="/"
        class="brand"
        aria-label="EvalLoop AI"
      >
        EvalLoop AI<span class="brand-cursor">_</span>
      </a>
      <a
        href="/"
        class="back"
      >
        ← BACK TO EVALLOOP AI
      </a>
    </div>
  </header>
  <!-- =========================================
       MAIN
       ========================================= -->
  <main>
    <section class="auth-container">
      <div class="kicker">
        <span class="kicker-line"></span>
        AUTHENTICATION
      </div>
      <h1>
        Create account<span>.</span>
      </h1>
      <p class="intro">
        Create your EvalLoop AI workspace and start
        measuring, evaluating, and improving AI systems.
      </p>
      <!-- AUTHENTICATION -->
      <div class="auth-section">
        <div class="auth-section-header">
          CONTINUE WITH
        </div>
        <!-- SOCIAL PROVIDERS -->
        <div class="provider-grid">
          <!-- GOOGLE -->
          <button
            type="button"
            class="provider-button"
            data-provider="Google"
          >
            <svg
              class="provider-logo"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="#4285F4"
                d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.44a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.57-5.17 3.57-8.64Z"
              />
              <path
                fill="#34A853"
                d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.87-3c-1.07.72-2.44 1.15-4.08 1.15-3.14 0-5.8-2.12-6.75-4.97H1.25v3.09A12 12 0 0 0 12 24Z"
              />
              <path
                fill="#FBBC05"
                d="M5.25 14.28A7.2 7.2 0 0 1 4.87 12c0-.79.14-1.56.38-2.28V6.63H1.25A12 12 0 0 0 0 12c0 1.93.46 3.76 1.25 5.37l4-3.09Z"
              />
              <path
                fill="#EA4335"
                d="M12 4.75c1.76 0 3.34.61 4.59 1.81l3.44-3.44C17.95 1.17 15.23 0 12 0A12 12 0 0 0 1.25 6.63l4 3.09C6.2 6.87 8.86 4.75 12 4.75Z"
              />
            </svg>
            CONTINUE WITH GOOGLE
          </button>
          <!-- GITHUB -->
          <button
            type="button"
            class="provider-button"
            data-provider="GitHub"
          >
            <svg
              class="provider-logo"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M12 .3a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.05c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.49.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.94 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.29-1.23 3.29-1.23.65 1.65.24 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.93.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .3Z"
              />
            </svg>
            CONTINUE WITH GITHUB
          </button>
        </div>
        <!-- OR -->
        <div class="or-row">
          <span class="or-line"></span>
          <span class="or-text">
            OR
          </span>
          <span class="or-line"></span>
        </div>
        <!-- FORM -->
        <form
          class="auth-form"
          id="signupForm"
        >
          <div class="field">
            <label
              class="field-label"
              for="name"
            >
              NAME
            </label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your name"
              autocomplete="name"
              required
            >
          </div>
          <div class="field">
            <label
              class="field-label"
              for="email"
            >
              EMAIL
            </label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>
          <div class="field">
            <label
              class="field-label"
              for="password"
            >
              PASSWORD
            </label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="8"
              required
            >
          </div>
          <div class="field">
            <label
              class="field-label"
              for="confirmPassword"
            >
              CONFIRM PASSWORD
            </label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              minlength="8"
              required
            >
          </div>
          <div class="submit-row">
            <button
              type="submit"
              class="submit-button"
            >
              CREATE ACCOUNT →
            </button>
          </div>
        </form>
      </div>
      <!-- SWITCH -->
      <div class="auth-switch">
        <span>
          ALREADY HAVE AN ACCOUNT?
        </span>
        <a href="/login/">
          SIGN IN →
        </a>
      </div>
    </section>
  </main>
  <!-- =========================================
       FOOTER
       ========================================= -->
  <footer>
    <div class="footer-inner">
      <span>
        © 2026 EvalLoop AI
      </span>
      <span>
        BUILT FOR BETTER AI
      </span>
      <span>
        HYDERABAD · INDIA
      </span>
    </div>
  </footer>
  <!-- =========================================
       TEMPORARY UI HANDLER
       ========================================= -->
  <script>
    const signupForm =
      document.getElementById("signupForm");
    signupForm.addEventListener(
      "submit",
      function(event) {
        event.preventDefault();
        const password =
          document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;
        if (password !== confirmPassword) {
          alert("Passwords do not match.");
          return;
        }
        alert(
          "Authentication is not connected yet."
        );
      }
    );
    document
      .querySelectorAll(".provider-button")
      .forEach(function(button) {
        button.addEventListener(
          "click",
          function() {
            alert(
              button.dataset.provider +
              " authentication is not connected yet."
            );
          }
        );
      });
  </script>
</body>
</html>
