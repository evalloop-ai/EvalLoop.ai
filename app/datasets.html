<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101211" />
  <meta name="description" content="EvalLoop AI Workspace — evaluate, compare, test, and improve AI systems." />

  <title>Datasets — EvalLoop AI</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --bg: #101211;
      --panel: #171b18;
      --panel-2: #1d221f;

      --text: #f1f1ef;
      --muted: #a4aaa6;
      --dim: #727974;

      --green: #3ecf8e;
      --green-light: #85e7ba;
      --green-dark: #13261c;

      --border: rgba(241, 241, 239, 0.14);
      --border-soft: rgba(241, 241, 239, 0.08);

      --danger: #ff7777;

      --max: 1200px;
      --sidebar-width: 238px;
      --header-height: 68px;
      --radius: 10px;
    }

    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(rgba(16, 18, 17, 0.96), rgba(16, 18, 17, 0.96)),
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 39px,
          rgba(241, 241, 239, 0.028) 40px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 39px,
          rgba(241, 241, 239, 0.028) 40px
        );

      color: var(--text);
      font-family: "Inter", sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.6;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.menu-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    ::selection {
      background: rgba(62, 207, 142, 0.22);
      color: var(--text);
    }

    /* =========================================================
       ACCESSIBILITY
    ========================================================= */

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 1px solid var(--green);
      outline-offset: 3px;
    }

    /* =========================================================
       APP SHELL
    ========================================================= */

    .app-shell {
      min-height: 100vh;
      position: relative;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .workspace-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      background: rgba(16, 18, 17, 0.86);
      border-bottom: 1px solid var(--border-soft);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
    }

    .header-left {
      gap: 18px;
      min-width: 0;
    }

    .header-right {
      gap: 12px;
    }

    .brand-back {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      color: var(--text);
      font-family: "DM Mono", monospace;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;

      transition: color 180ms ease, opacity 180ms ease;
    }

    .brand-back:hover {
      color: var(--green-light);
    }

    .brand-arrow {
      color: var(--green);
      font-size: 15px;
      transition: color 180ms ease;
    }

    /* =========================================================
       EVALLOOP AI — SIGNATURE BLINKING GREEN UNDERSCORE
    ========================================================= */

    .brand-back .brand-underscore {
      display: inline-block;
      margin-left: 1px;
      color: var(--green);
      font-weight: 500;
      animation: evalloop-cursor-blink 1s steps(2, start) infinite;
    }

    @keyframes evalloop-cursor-blink {
      to {
        visibility: hidden;
      }
    }

    .brand-back:hover .brand-underscore {
      color: var(--green-light);
    }

    .header-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
    }

    .workspace-identity {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .workspace-label {
      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .workspace-name {
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
    }

    .system-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 11px;
      font-weight: 400;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.08);
    }

    .account-button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px 5px 5px;

      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: rgba(241, 241, 239, 0.025);
      color: var(--text);

      transition: border-color 180ms ease, background 180ms ease;
    }

    .account-button:hover {
      border-color: var(--border);
      background: rgba(241, 241, 239, 0.045);
    }

    .account-avatar {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;

      border: 1px solid rgba(62, 207, 142, 0.28);
      border-radius: 7px;
      background: var(--green-dark);
      color: var(--green-light);

      font-family: "DM Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      overflow: hidden;
      background-repeat: no-repeat;
    }

    .account-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
    }

    .account-name {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
    }

    .account-email {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--dim);
      font-size: 10px;
      line-height: 1.35;
    }

    .account-chevron {
      color: var(--dim);
      font-size: 12px;
    }

    .mobile-menu-button {
      display: none;
      width: 38px;
      height: 38px;

      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 18px;
    }

    /* =========================================================
       MAIN LAYOUT
    ========================================================= */

    .workspace-layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: calc(100vh - var(--header-height));
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      position: sticky;
      top: var(--header-height);
      height: calc(100vh - var(--header-height));

      display: flex;
      flex-direction: column;
      padding: 24px 14px;

      border-right: 1px solid var(--border-soft);
      background: rgba(16, 18, 17, 0.52);
      overflow-y: auto;
    }

    .sidebar-section {
      margin-bottom: 26px;
    }

    .sidebar-heading {
      padding: 0 11px;
      margin-bottom: 9px;

      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 40px;
      padding: 8px 11px;

      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;

      transition: color 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .sidebar-link:hover {
      color: var(--text);
      background: rgba(241, 241, 239, 0.035);
    }

    .sidebar-link.active {
      border-color: rgba(62, 207, 142, 0.13);
      background: rgba(62, 207, 142, 0.07);
      color: var(--green-light);
    }

    .sidebar-icon {
      width: 16px;
      color: currentColor;
      font-family: "DM Mono", monospace;
      font-size: 12px;
      text-align: center;
    }

    .sidebar-divider {
      height: 1px;
      margin: 2px 11px 24px;
      background: var(--border-soft);
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    .workspace-health {
      padding: 13px;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: rgba(241, 241, 239, 0.018);
    }

    .health-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .health-label {
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    .health-value {
      color: var(--green-light);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    .health-description {
      margin: 0;
      color: var(--dim);
      font-size: 11px;
      line-height: 1.5;
    }

    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    .main-content {
      min-width: 0;
      padding: 42px 42px 60px;
    }

    .content-inner {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
    }

    /* =========================================================
       PAGE INTRO
    ========================================================= */

    .page-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--border-soft);
    }

    .page-kicker {
      margin-bottom: 9px;
      color: var(--green);
      font-family: "DM Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(29px, 4vw, 42px);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.1;
    }

    .page-title span {
      color: var(--green-light);
    }

    .page-description {
      max-width: 650px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.7;
    }

    .page-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 39px;
      padding: 8px 13px;

      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;

      transition: border-color 180ms ease, color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .button:hover {
      border-color: rgba(62, 207, 142, 0.4);
      background: rgba(62, 207, 142, 0.045);
      color: var(--green-light);
      transform: translateY(-1px);
    }

    .button-primary {
      border-color: rgba(62, 207, 142, 0.34);
      background: rgba(62, 207, 142, 0.08);
      color: var(--green-light);
    }

    .button-primary:hover {
      border-color: rgba(62, 207, 142, 0.55);
      background: rgba(62, 207, 142, 0.12);
    }

    /* =========================================================
       SYSTEM STRIP
    ========================================================= */

    .system-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding: 12px 14px;

      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: rgba(241, 241, 239, 0.018);
      color: var(--muted);
      font-size: 12px;
    }

    .system-strip strong {
      color: var(--text);
      font-weight: 500;
    }

    .system-strip .strip-dot {
      width: 6px;
      height: 6px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--green);
    }

    .system-strip .strip-status {
      margin-left: auto;
      color: var(--green);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    /* =========================================================
       KPI GRID
    ========================================================= */

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .kpi-card {
      min-height: 128px;
      padding: 18px;
      border: 1px solid var(--border-soft);
      border-radius: 9px;
      background: rgba(23, 27, 24, 0.66);
    }

    .kpi-label {
      margin-bottom: 17px;
      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .kpi-value {
      color: var(--text);
      font-family: "DM Mono", monospace;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    .kpi-sub {
      margin-top: 5px;
      color: var(--dim);
      font-size: 11px;
    }

    /* =========================================================
       SECTIONS
    ========================================================= */

    .section {
      margin-top: 38px;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-kicker {
      margin-bottom: 4px;
      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .section-title {
      margin: 0;
      color: var(--text);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .section-link {
      color: var(--green-light);
      font-family: "DM Mono", monospace;
      font-size: 11px;
      transition: color 180ms ease;
    }

    .section-link:hover {
      color: var(--green);
    }

    /* =========================================================
       OVERVIEW GRID
    ========================================================= */

    .overview-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.8fr);
      gap: 10px;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--border-soft);
      border-radius: 9px;
      background: rgba(23, 27, 24, 0.66);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 17px;
      border-bottom: 1px solid var(--border-soft);
    }

    .panel-title {
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
    }

    .panel-meta {
      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    /* =========================================================
       EMPTY STATE
    ========================================================= */

    .empty-state {
      min-height: 258px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 25px;
      text-align: center;
    }

    .empty-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;

      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(241, 241, 239, 0.018);
      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 15px;
    }

    .empty-title {
      margin: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
    }

    .empty-description {
      max-width: 390px;
      margin: 7px 0 15px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .text-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--green-light);
      font-family: "DM Mono", monospace;
      font-size: 11px;
      transition: color 180ms ease;
    }

    .text-action:hover {
      color: var(--green);
    }

    /* =========================================================
       QUALITY TREND
    ========================================================= */

    .trend-area {
      position: relative;
      height: 258px;
      overflow: hidden;
    }

    .trend-grid {
      position: absolute;
      inset: 25px 18px 30px;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 39px,
          rgba(241, 241, 239, 0.055) 40px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 59px,
          rgba(241, 241, 239, 0.04) 60px
        );
    }

    .trend-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: var(--dim);
      font-size: 12px;
      text-align: center;
    }

    .trend-empty-inner {
      max-width: 220px;
    }

    .trend-empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-weight: 500;
    }

    /* =========================================================
       QUICK START
    ========================================================= */

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .quick-card {
      position: relative;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      padding: 18px;

      border: 1px solid var(--border-soft);
      border-radius: 9px;
      background: rgba(23, 27, 24, 0.66);

      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .quick-card:hover {
      border-color: rgba(62, 207, 142, 0.22);
      background: rgba(29, 34, 31, 0.76);
      transform: translateY(-2px);
    }

    .quick-type {
      margin-bottom: 18px;
      color: var(--green);
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .quick-title {
      margin: 0 0 7px;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .quick-description {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .quick-arrow {
      margin-top: auto;
      padding-top: 18px;
      color: var(--green-light);
      font-family: "DM Mono", monospace;
      font-size: 11px;
    }

    /* =========================================================
       EVALUATION FLOW
    ========================================================= */

    .flow-panel {
      padding: 23px;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      gap: 0;
    }

    .flow-step {
      position: relative;
      padding: 5px 18px 5px 0;
    }

    .flow-step:not(:last-child)::after {
      content: "→";
      position: absolute;
      top: 5px;
      right: 10px;
      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 13px;
    }

    .flow-number {
      margin-bottom: 8px;
      color: var(--green);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    .flow-title {
      margin-bottom: 4px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
    }

    .flow-description {
      color: var(--dim);
      font-size: 11px;
      line-height: 1.5;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .workspace-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-links a {
      transition: color 180ms ease;
    }

    .footer-links a:hover {
      color: var(--green-light);
    }

    /* =========================================================
       AUTH LOCK OVERLAY
    ========================================================= */

    .auth-lock {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background: rgba(5, 7, 6, 0.88);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);

      opacity: 1;
      visibility: visible;
      transition: opacity 200ms ease, visibility 200ms ease;
    }

    .auth-lock.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .auth-lock-content {
      width: min(420px, 100%);
      padding: 34px 30px;

      border: 1px solid rgba(241, 241, 239, 0.12);
      border-radius: 11px;
      background: rgba(16, 18, 17, 0.93);
      text-align: center;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .lock-symbol {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;

      border: 1px solid rgba(62, 207, 142, 0.25);
      border-radius: 9px;
      background: rgba(62, 207, 142, 0.06);
      color: var(--green-light);
      font-family: "DM Mono", monospace;
      font-size: 16px;
    }

    .auth-lock-title {
      margin: 0;
      color: var(--text);
      font-size: 21px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .auth-lock-title span {
      color: var(--green-light);
    }

    .auth-lock-description {
      max-width: 340px;
      margin: 9px auto 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .auth-lock-actions {
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    .auth-lock-note {
      margin: 18px 0 0;
      color: var(--dim);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    /* =========================================================
       AUTH CHECK LOADING
    ========================================================= */

    .auth-loading {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .auth-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 11px;
    }

    .loading-mark {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(62, 207, 142, 0.22);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 850ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ACCOUNT MENU
    ========================================================= */

    .account-menu {
      position: fixed;
      top: 58px;
      right: 24px;
      z-index: 150;
      width: 190px;
      padding: 6px;

      border: 1px solid var(--border);
      border-radius: 9px;
      background: #171b18;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.32);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px);
      transition: opacity 160ms ease, visibility 160ms ease, transform 160ms ease;
    }

    .account-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .account-menu-item {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 37px;
      padding: 8px 10px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
      transition: color 160ms ease, background 160ms ease;
    }

    .account-menu-item:hover {
      background: rgba(241, 241, 239, 0.045);
      color: var(--text);
    }

    .account-menu-divider {
      height: 1px;
      margin: 5px 3px;
      background: var(--border-soft);
    }

    .account-menu-item.logout {
      color: #df8b8b;
    }

    .account-menu-item.logout:hover {
      color: #ffaaaa;
      background: rgba(255, 100, 100, 0.05);
    }

    /* =========================================================
       MOBILE SIDEBAR BACKDROP
    ========================================================= */

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.56);
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1100px) {
      .main-content {
        padding: 36px 28px 50px;
      }

      .quick-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .overview-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      :root {
        --sidebar-width: 220px;
      }

      .workspace-header {
        padding: 0 18px;
      }

      .system-status {
        display: none;
      }

      .page-intro {
        align-items: flex-start;
        flex-direction: column;
      }

      .page-actions {
        width: 100%;
      }

      .page-actions .button {
        flex: 0 0 auto;
      }

      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .flow {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 0;
      }

      .flow-step:nth-child(2)::after {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .mobile-menu-button {
        display: grid;
        place-items: center;
      }

      .workspace-layout {
        display: block;
      }

      .sidebar {
        position: fixed;
        top: var(--header-height);
        left: 0;
        bottom: 0;
        z-index: 95;
        width: min(280px, 86vw);
        height: auto;
        transform: translateX(-100%);
        background: #101211;
        transition: transform 220ms ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop.open {
        display: block;
      }

      .main-content {
        padding: 30px 18px 45px;
      }

      .header-divider,
      .workspace-label {
        display: none;
      }

      .workspace-name {
        max-width: 180px;
      }

      .account-info,
      .account-chevron {
        display: none;
      }

      .account-button {
        padding: 4px;
      }

      .page-title {
        font-size: 30px;
      }

      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .flow {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .flow-step {
        padding-right: 0;
      }

      .flow-step:not(:last-child)::after {
        content: "↓";
        top: auto;
        right: auto;
        bottom: -18px;
        left: 0;
      }

      .workspace-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .auth-lock-content {
        padding: 30px 22px;
      }
    }

    @media (max-width: 500px) {
      .workspace-header {
        height: 62px;
      }

      :root {
        --header-height: 62px;
      }

      .brand-back {
        font-size: 12px;
      }

      .workspace-name {
        max-width: 130px;
      }

      .main-content {
        padding: 26px 14px 40px;
      }

      .page-description {
        font-size: 13px;
      }

      .page-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .page-actions .button {
        width: 100%;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .kpi-card {
        min-height: 112px;
      }

      .system-strip {
        align-items: flex-start;
      }

      .system-strip .strip-status {
        display: none;
      }

      .panel-header {
        padding: 0 14px;
      }

      .empty-state {
        min-height: 235px;
      }

      .trend-area {
        height: 235px;
      }

      .auth-lock-actions {
        flex-direction: column;
      }

      .auth-lock-actions .button {
        width: 100%;
      }

      .account-menu {
        right: 14px;
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      .brand-back .brand-underscore {
        animation: none;
        visibility: visible;
      }
    }
  </style>
  <link rel="stylesheet" href="/workspace-v2.css" />
</head>

<body>

  <!-- AUTH CHECK LOADING -->
  <div class="auth-loading" id="authLoading" aria-live="polite">
    <div class="loading-inner">
      <div class="loading-mark" aria-hidden="true"></div>
      <span>Checking your workspace…</span>
    </div>
  </div>

  <!-- APPLICATION -->
  <div class="app-shell" id="appShell">

    <!-- HEADER -->
    <header class="workspace-header">

      <div class="header-left">

        <button
          class="mobile-menu-button"
          id="mobileMenuButton"
          type="button"
          aria-label="Open workspace navigation"
          aria-expanded="false"
        >☰</button>

        <!-- EVALLOOP AI BRAND WITH BLINKING GREEN UNDERSCORE -->
        <a class="brand-back" href="/" aria-label="Back to EvalLoop AI">
          <span class="brand-arrow" aria-hidden="true">←</span>
          <span>EvalLoop AI<span class="brand-underscore" aria-hidden="true">_</span></span>
        </a>

        <span class="header-divider" aria-hidden="true"></span>

        <div class="workspace-identity">
          <span class="workspace-label">Workspace</span>
          <span class="workspace-name" id="workspaceName"></span>
        </div>

      </div>

      <div class="header-right">

        <div class="system-status" aria-label="Workspace system status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connectionState">CONNECTING</span>
        </div>

        <button
          class="account-button"
          id="accountButton"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span class="account-avatar" id="accountAvatar">U</span>

          <span class="account-info">
            <span class="account-name" id="accountName">User</span>
            <span class="account-email" id="accountEmail">—</span>
          </span>

          <span class="account-chevron" aria-hidden="true">▾</span>
        </button>

      </div>
    </header>

    <!-- ACCOUNT MENU -->
    <div class="account-menu" id="accountMenu" role="menu" aria-hidden="true">
      <button class="account-menu-item" type="button" role="menuitem" data-action="profile">
        Profile
      </button>

      <button class="account-menu-item" type="button" role="menuitem" data-action="settings">
        Settings
      </button>

      <div class="account-menu-divider" aria-hidden="true"></div>

      <button class="account-menu-item logout" type="button" role="menuitem" id="logoutButton">
        Log out
      </button>
    </div>

    <!-- WORKSPACE LAYOUT -->
    <div class="workspace-layout">

      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">

        <div class="sidebar-section">
          <div class="sidebar-heading">Workspace</div>

          <nav class="sidebar-nav">
            <a href="?page=overview" data-page="overview" class="sidebar-link active" aria-current="page">
              <span class="sidebar-icon" aria-hidden="true">/</span>
              <span>Overview</span>
            </a>

            <a href="?page=evaluations" data-page="evaluations" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">◫</span>
              <span>Evaluations</span>
            </a>

            <a href="?page=runs" data-page="runs" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">≡</span>
              <span>Runs</span>
            </a>

            <a href="?page=datasets" data-page="datasets" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">▦</span>
              <span>Datasets</span>
            </a>

            <a href="/app/general_response.html" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">↳</span>
              <span>AI Response</span>
            </a>

            <a href="?page=comparison" data-page="comparison" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">⇄</span>
              <span>Model comparison</span>
            </a>

            <a href="?page=safety" data-page="safety" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">◇</span>
              <span>Safety evaluation</span>
            </a>

            <a href="?page=analysis" data-page="analysis" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">⌁</span>
              <span>Analysis</span>
            </a>
          </nav>
        </div>

        <div class="sidebar-divider" aria-hidden="true"></div>

        <div class="sidebar-section">
          <div class="sidebar-heading">Tools</div>

          <nav class="sidebar-nav">
            <a href="/docs/" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">?</span>
              <span>Documentation</span>
            </a>

            <a href="?page=settings" data-page="settings" class="sidebar-link">
              <span class="sidebar-icon" aria-hidden="true">⚙</span>
              <span>Settings</span>
            </a>
          </nav>
        </div>

        <div class="sidebar-bottom">
          <div class="workspace-health">
            <div class="health-top">
              <span class="health-label">WORKSPACE</span>
              <span class="health-value" id="workspaceHealth">READY</span>
            </div>

            <p class="health-description" id="workspaceHealthText">Connecting to protected workspace records…</p>
          </div>
        </div>

      </aside>

      <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

      <!-- MAIN CONTENT -->
      <main class="main-content"><div class="content-inner" id="pageRoot"><div class="loading-panel">Loading workspace data…</div></div></main>
    </div>
  </div>

  <!-- GLOBAL MOBILE SIDEBAR BACKDROP -->
  <div class="sidebar-backdrop" id="globalSidebarBackdrop" aria-hidden="true"></div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <dialog id="appDialog" class="app-dialog">
    <form id="dialogForm" method="dialog">
      <div id="dialogContent"></div>
      <div class="dialog-actions">
        <button type="button" class="button" id="dialogCancel">Cancel</button>
        <button type="submit" class="button button-primary" id="dialogSubmit">Save</button>
      </div>
    </form>
  </dialog>
  <script>
    // Open the existing workspace shell directly on the Datasets page.
    if (!new URLSearchParams(location.search).has('page')) {
      const url = new URL(location.href);
      url.searchParams.set('page', 'datasets');
      history.replaceState({}, '', url);
    }
  </script>
  <script src="/workspace-v2.js"></script>

</body>
</html>
