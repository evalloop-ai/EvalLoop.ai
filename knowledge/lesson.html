<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lesson — EvalLoop AI</title>

  <meta
    name="description"
    content="AI evaluation lesson — EvalLoop AI Learn."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #101211;
      --panel: #171b18;
      --panel2: #1d221f;
      --ink: #f1f1ef;
      --muted: #a4aaa6;
      --dim: #727974;
      --line: rgba(241,241,239,.14);
      --line-soft: rgba(241,241,239,.08);
      --green: #3ecf8e;
      --green2: #85e7ba;
      --darkgreen: #13261c;
      --sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "DM Mono", monospace;
      --max: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 80% 0%, rgba(62,207,142,.08), transparent 30%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.75;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .025;
      background-image:
        linear-gradient(rgba(255,255,255,.7) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.7) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(16,18,17,.9);
      backdrop-filter: blur(18px);
    }

    .nav {
      max-width: var(--max);
      margin: auto;
      padding: 0 24px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: var(--mono);
      font-size: 17px;
    }

    .brand span {
      color: var(--green);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .back {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
    }

    .back:hover {
      color: var(--green);
    }

    main {
      max-width: var(--max);
      margin: auto;
      padding: 75px 24px 100px;
    }

    .loading,
    .error {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 30px;
      color: var(--muted);
    }

    .error {
      color: #ffaaaa;
      border-color: rgba(255,100,100,.3);
    }

    .lesson-header {
      max-width: 850px;
      margin-bottom: 65px;
    }

    .eyebrow {
      color: var(--green);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 20px;
      font-size: clamp(38px, 6vw, 66px);
      line-height: 1.05;
      letter-spacing: -.05em;
      font-weight: 300;
    }

    .subtitle {
      color: var(--muted);
      font-size: 17px;
      max-width: 760px;
    }

    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 25px;
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 6px 10px;
      border-radius: 3px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
    }

    .content {
      max-width: 850px;
    }

    .block {
      margin: 55px 0;
    }

    .block h2 {
      font-size: 22px;
      font-weight: 400;
      margin: 0 0 18px;
      letter-spacing: -.02em;
    }

    .block p {
      color: var(--muted);
      font-size: 15px;
      margin: 0 0 18px;
    }

    .definition {
      border-left: 2px solid var(--green);
      background: var(--darkgreen);
      padding: 24px 25px;
      color: var(--ink);
      font-size: 17px;
    }

    .objectives,
    .process,
    .list {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .objectives li,
    .process li,
    .list li {
      border: 1px solid var(--line-soft);
      background: rgba(23,27,24,.7);
      padding: 13px 15px;
      color: var(--muted);
      font-size: 13px;
    }

    .objectives li::before {
      content: "→";
      color: var(--green);
      margin-right: 10px;
    }

    .process {
      counter-reset: process;
    }

    .process li {
      counter-increment: process;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: start;
    }

    .process li::before {
      content: counter(process, decimal-leading-zero);
      color: var(--green);
      font-family: var(--mono);
      font-size: 10px;
    }

    .example {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 5px;
      overflow: hidden;
    }

    .example-row {
      padding: 20px;
      border-bottom: 1px solid var(--line-soft);
    }

    .example-row:last-child {
      border-bottom: 0;
    }

    .example-label {
      color: var(--green);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .example-text {
      color: var(--muted);
      font-size: 14px;
      white-space: pre-wrap;
    }

    .takeaway {
      border: 1px solid rgba(62,207,142,.28);
      background: rgba(19,38,28,.65);
      padding: 25px;
    }

    .takeaway strong {
      display: block;
      color: var(--green2);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .takeaway div {
      font-size: 16px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      color: var(--dim);
      border: 1px solid var(--line-soft);
      padding: 5px 8px;
      font-family: var(--mono);
      font-size: 9px;
    }

    .navigation {
      border-top: 1px solid var(--line);
      margin-top: 80px;
      padding-top: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .nav-card {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 18px;
      min-height: 100px;
      transition: border-color .2s;
    }

    .nav-card:hover {
      border-color: rgba(62,207,142,.4);
    }

    .nav-card.next {
      text-align: right;
    }

    .nav-label {
      color: var(--dim);
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .nav-title {
      font-size: 14px;
      color: var(--ink);
    }

    footer {
      border-top: 1px solid var(--line-soft);
      padding: 35px 24px;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 9px;
      text-align: center;
    }

    @media (max-width: 650px) {
      main {
        padding: 55px 18px 70px;
      }

      .navigation {
        grid-template-columns: 1fr;
      }

      .nav-card.next {
        text-align: left;
      }

      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

<div class="grid"></div>

<header>
  <nav class="nav">
    <a class="brand" href="/">EvalLoop AI<span>_</span></a>

    <a class="back" href="/knowledge/">
      ← BACK TO LEARN
    </a>
  </nav>
</header>

<main>

  <div id="app" class="loading">
    Loading lesson…
  </div>

</main>

<footer>
  © 2026 EvalLoop AI · BUILT FOR BETTER AI · HYDERABAD · INDIA
</footer>

<script>
  const DATA_URL = "/knowledge/lessons.json";

  const app = document.getElementById("app");

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    return params.get("slug");
  }

  function list(items) {
    if (!Array.isArray(items) || !items.length) {
      return "";
    }

    return items.map(item => `
      <li>${escapeHTML(item)}</li>
    `).join("");
  }

  function renderLesson(lesson, lessons) {
    const index = lessons.findIndex(item => item.slug === lesson.slug);

    const previous =
      index > 0 ? lessons[index - 1] : null;

    const next =
      index < lessons.length - 1 ? lessons[index + 1] : null;

    document.title =
      `${lesson.title} — EvalLoop AI Learn`;

    app.className = "";

    app.innerHTML = `
      <header class="lesson-header">

        <div class="eyebrow">
          LEVEL ${String(lesson.level).padStart(2, "0")}
          · ${escapeHTML(lesson.track)}
        </div>

        <h1>${escapeHTML(lesson.title)}</h1>

        <div class="subtitle">
          ${escapeHTML(lesson.definition)}
        </div>

        <div class="lesson-meta">
          <span class="pill">${escapeHTML(lesson.category)}</span>
          <span class="pill">${escapeHTML(lesson.difficulty)}</span>
          <span class="pill">${escapeHTML(lesson.readTime)}</span>
          <span class="pill">Lesson ${lesson.order} / ${lessons.length}</span>
        </div>

      </header>

      <article class="content">

        <section class="block">
          <h2>Definition</h2>

          <div class="definition">
            ${escapeHTML(lesson.definition)}
          </div>
        </section>

        <section class="block">
          <h2>Why it matters</h2>

          <p>
            ${escapeHTML(lesson.whyItMatters)}
          </p>
        </section>

        <section class="block">
          <h2>What you will learn</h2>

          <ul class="objectives">
            ${list(lesson.objectives)}
          </ul>
        </section>

        <section class="block">
          <h2>Core concept</h2>

          <p>
            ${escapeHTML(lesson.concept)}
          </p>
        </section>

        ${
          lesson.example
          ? `
            <section class="block">
              <h2>Worked example</h2>

              <div class="example">

                <div class="example-row">
                  <div class="example-label">Prompt</div>
                  <div class="example-text">
                    ${escapeHTML(lesson.example.prompt)}
                  </div>
                </div>

                <div class="example-row">
                  <div class="example-label">Model response</div>
                  <div class="example-text">
                    ${escapeHTML(lesson.example.response)}
                  </div>
                </div>

                <div class="example-row">
                  <div class="example-label">Evaluation analysis</div>
                  <div class="example-text">
                    ${escapeHTML(lesson.example.analysis)}
                  </div>
                </div>

              </div>
            </section>
          `
          : ""
        }

        <section class="block">
          <h2>Evaluation process</h2>

          <ol class="process">
            ${list(lesson.evaluationProcess)}
          </ol>
        </section>

        <section class="block">
          <h2>Failure modes</h2>

          <ul class="list">
            ${list(lesson.failureModes)}
          </ul>
        </section>

        <section class="block">
          <h2>Evaluator checklist</h2>

          <ul class="list">
            ${list(lesson.evaluatorChecklist)}
          </ul>
        </section>

        <section class="block">
          <h2>Common mistakes</h2>

          <ul class="list">
            ${list(lesson.commonMistakes)}
          </ul>
        </section>

        <section class="block">
          <h2>Tags</h2>

          <div class="tags">
            ${(lesson.tags || []).map(tag => `
              <span class="tag">${escapeHTML(tag)}</span>
            `).join("")}
          </div>
        </section>

        <section class="block">
          <div class="takeaway">
            <strong>Key takeaway</strong>
            <div>${escapeHTML(lesson.keyTakeaway)}</div>
          </div>
        </section>

        <nav class="navigation">

          ${
            previous
            ? `
              <a
                class="nav-card"
                href="/knowledge/lesson.html?slug=${encodeURIComponent(previous.slug)}"
              >
                <div class="nav-label">← Previous lesson</div>
                <div class="nav-title">
                  ${escapeHTML(previous.title)}
                </div>
              </a>
            `
            : `
              <a
                class="nav-card"
                href="/knowledge/"
              >
                <div class="nav-label">← Course roadmap</div>
                <div class="nav-title">
                  Back to Learn
                </div>
              </a>
            `
          }

          ${
            next
            ? `
              <a
                class="nav-card next"
                href="/knowledge/lesson.html?slug=${encodeURIComponent(next.slug)}"
              >
                <div class="nav-label">Next lesson →</div>
                <div class="nav-title">
                  ${escapeHTML(next.title)}
                </div>
              </a>
            `
            : `
              <a
                class="nav-card next"
                href="/knowledge/"
              >
                <div class="nav-label">Course complete</div>
                <div class="nav-title">
                  Return to Learn →
                </div>
              </a>
            `
          }

        </nav>

      </article>
    `;
  }

  async function init() {
    const slug = getSlug();

    if (!slug) {
      app.className = "error";
      app.innerHTML = `
        No lesson selected.
        <br><br>
        <a href="/knowledge/">← Return to Learn</a>
      `;
      return;
    }

    try {
      const response = await fetch(DATA_URL, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Unable to load lessons.json");
      }

      const data = await response.json();

      if (!Array.isArray(data.lessons)) {
        throw new Error("Invalid lessons.json");
      }

      const lesson = data.lessons.find(
        item => item.slug === slug
      );

      if (!lesson) {
        app.className = "error";
        app.innerHTML = `
          Lesson not found.
          <br><br>
          <a href="/knowledge/">← Return to Learn</a>
        `;
        return;
      }

      renderLesson(lesson, data.lessons);

    } catch (error) {
      console.error(error);

      app.className = "error";
      app.innerHTML = `
        Unable to load this lesson.
        <br><br>
        Check <strong>/knowledge/lessons.json</strong>.
      `;
    }
  }

  init();
</script>

</body>
</html>
