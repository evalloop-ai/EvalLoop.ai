<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Reset Password — EvalLoop AI</title>

  <meta
    name="description"
    content="Reset your EvalLoop AI account password."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #101211;
      --panel: #171b18;
      --panel-2: #1d221f;

      --text: #f1f1ef;
      --muted: #a4aaa6;
      --dim: #727974;

      --green: #3ecf8e;
      --green-light: #85e7ba;
      --green-dark: #13261c;

      --border: rgba(241, 241, 239, 0.14);
      --border-soft: rgba(241, 241, 239, 0.08);

      --danger: #ff8f8f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background:
        linear-gradient(
          rgba(62, 207, 142, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(62, 207, 142, 0.025) 1px,
          transparent 1px
        ),
        var(--bg);

      background-size: 42px 42px;

      color: var(--text);

      font-family: "Inter", sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    /* =========================================
       PAGE
    ========================================= */

    .page {
      width: 100%;
      max-width: 440px;
    }

    /* =========================================
       BRAND
    ========================================= */

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 28px;
    }

    .brand-logo {
      color: var(--text);

      text-decoration: none;

      font-family: "DM Mono", monospace;
      font-size: 18px;
      font-weight: 400;

      letter-spacing: -0.04em;
    }

    .brand-logo:hover {
      color: var(--text);
    }

    .brand-cursor {
      color: var(--green);

      animation:
        blinkCursor 1.1s steps(1, end) infinite;
    }

    @keyframes blinkCursor {
      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }
    }

    /* =========================================
       CARD
    ========================================= */

    .card {
      width: 100%;

      background: rgba(23, 27, 24, 0.96);

      border: 1px solid var(--border);

      border-radius: 16px;

      padding: 34px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.28);
    }

    /* =========================================
       HEADER
    ========================================= */

    .eyebrow {
      color: var(--green);

      font-family: "DM Mono", monospace;

      font-size: 11px;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;

      font-size: 28px;

      line-height: 1.15;

      font-weight: 500;

      letter-spacing: -0.035em;
    }

    .description {
      margin: 0 0 28px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;
    }

    /* =========================================
       FORM
    ========================================= */

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: var(--muted);

      font-size: 12px;

      font-weight: 500;
    }

    input {
      width: 100%;

      height: 46px;

      padding: 0 14px;

      border-radius: 9px;

      border: 1px solid var(--border);

      outline: none;

      background: var(--panel-2);

      color: var(--text);

      font-family: "Inter", sans-serif;

      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    input::placeholder {
      color: var(--dim);
    }

    input:focus {
      border-color:
        rgba(62, 207, 142, 0.65);

      box-shadow:
        0 0 0 3px
        rgba(62, 207, 142, 0.08);
    }

    input:disabled {
      opacity: 0.45;

      cursor: not-allowed;
    }

    /* =========================================
       BUTTON
    ========================================= */

    button {
      width: 100%;

      height: 46px;

      border: 0;

      border-radius: 9px;

      background: var(--green);

      color: #07140d;

      font-family: "Inter", sans-serif;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        background 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--green-light);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    /* =========================================
       MESSAGE
    ========================================= */

    .message {
      display: none;

      margin-top: 18px;

      padding: 12px 14px;

      border-radius: 9px;

      font-size: 13px;

      line-height: 1.55;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: var(--green-light);

      background: var(--green-dark);

      border:
        1px solid
        rgba(62, 207, 142, 0.18);
    }

    .message.error {
      color: var(--danger);

      background:
        rgba(255, 143, 143, 0.06);

      border:
        1px solid
        rgba(255, 143, 143, 0.16);
    }

    /* =========================================
       LOADING
    ========================================= */

    .loading {
      display: none;

      margin-top: 18px;

      text-align: center;

      color: var(--dim);

      font-family: "DM Mono", monospace;

      font-size: 11px;
    }

    .loading.show {
      display: block;
    }

    /* =========================================
       FOOTER
    ========================================= */

    .footer {
      margin-top: 22px;

      text-align: center;
    }

    .footer a {
      color: var(--muted);

      font-size: 13px;

      text-decoration: none;

      transition:
        color 0.2s ease;
    }

    .footer a:hover {
      color: var(--green-light);
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 520px) {

      body {
        padding: 16px;
      }

      .card {
        padding: 26px 22px;
      }

      h1 {
        font-size: 25px;
      }

      .brand {
        margin-bottom: 22px;
      }

    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =======================================
         EVALLOOP AI BRAND
    ======================================== -->

    <div class="brand">

      <a
        href="/"
        class="brand-logo"
        aria-label="EvalLoop AI home"
      >
        EvalLoop AI<span class="brand-cursor">_</span>
      </a>

    </div>


    <!-- =======================================
         RESET PASSWORD CARD
    ======================================== -->

    <section class="card">

      <div class="eyebrow">
        Account recovery
      </div>


      <h1>
        Reset your password
      </h1>


      <p class="description">
        Enter a new password for your EvalLoop AI account.
      </p>


      <form
        id="resetPasswordForm"
        novalidate
      >

        <!-- New Password -->

        <div class="field">

          <label for="password">
            New password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Enter your new password"
            minlength="6"
            autocomplete="new-password"
            required
            disabled
          />

        </div>


        <!-- Confirm Password -->

        <div class="field">

          <label for="confirmPassword">
            Confirm password
          </label>

          <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm your new password"
            minlength="6"
            autocomplete="new-password"
            required
            disabled
          />

        </div>


        <!-- Submit -->

        <button
          id="resetButton"
          type="submit"
          disabled
        >
          Verifying reset link...
        </button>

      </form>


      <!-- Message -->

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- Loading -->

      <div
        id="loading"
        class="loading"
        aria-live="polite"
      >
        Updating password...
      </div>


      <!-- Footer -->

      <div class="footer">

        <a href="/login/">
          ← Back to login
        </a>

      </div>

    </section>

  </main>


  <!-- =========================================
       SUPABASE AUTHENTICATION
  ========================================== -->

  <script>

    /* =========================================
       SUPABASE CONFIGURATION
    ========================================= */

    const SUPABASE_URL =
      "https://vonknmobshxkhbewdoie.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_J_eboKnioENyrRqnp8uTkg_5I9rrE8t";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================
       DOM REFERENCES
    ========================================= */

    const form =
      document.getElementById(
        "resetPasswordForm"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const confirmPasswordInput =
      document.getElementById(
        "confirmPassword"
      );

    const resetButton =
      document.getElementById(
        "resetButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const loading =
      document.getElementById(
        "loading"
      );


    /* =========================================
       STATE
    ========================================= */

    let recoverySessionReady = false;


    /* =========================================
       MESSAGE HELPER
    ========================================= */

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    /* =========================================
       ENABLE RESET FORM
    ========================================= */

    function enableForm() {

      passwordInput.disabled = false;

      confirmPasswordInput.disabled = false;

      resetButton.disabled = false;

      resetButton.textContent =
        "Update password";

    }


    /* =========================================
       LOADING STATE
    ========================================= */

    function setLoading(
      isLoading
    ) {

      resetButton.disabled =
        isLoading;

      loading.classList.toggle(
        "show",
        isLoading
      );

      resetButton.textContent =
        isLoading
          ? "Updating..."
          : "Update password";

    }


    /* =========================================
       SUPABASE AUTH STATE LISTENER
       
       When Supabase receives the recovery
       link, it emits PASSWORD_RECOVERY.
    ========================================= */

    supabaseClient.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        console.log(
          "EvalLoop AI auth event:",
          event
        );


        if (
          event ===
          "PASSWORD_RECOVERY"
        ) {

          if (session) {

            recoverySessionReady =
              true;

            enableForm();

            showMessage(
              "Your reset link is valid. You can now choose a new password.",
              "success"
            );

          }

        }

      }
    );


    /* =========================================
       INITIALIZE RESET PAGE
    ========================================= */

    async function initializeResetPage() {

      try {

        /*
          First check whether Supabase has
          already created the recovery session.
        */

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.error(
            "Reset session error:",
            error
          );

        }


        if (
          data &&
          data.session
        ) {

          recoverySessionReady =
            true;

          enableForm();

          showMessage(
            "Your reset link is valid. You can now choose a new password.",
            "success"
          );

          return;

        }


        /*
          Supabase may still be processing
          the recovery URL.

          Wait briefly and check again.
        */

        setTimeout(
          async () => {

            try {

              const {
                data: retryData
              } =
                await supabaseClient.auth
                  .getSession();


              if (
                retryData &&
                retryData.session
              ) {

                recoverySessionReady =
                  true;

                enableForm();

                showMessage(
                  "Your reset link is valid. You can now choose a new password.",
                  "success"
                );

              } else {

                showMessage(
                  "This password reset link is missing or has expired. Please request a new reset email.",
                  "error"
                );

              }

            } catch (retryError) {

              console.error(
                "Reset session retry failed:",
                retryError
              );

              showMessage(
                "We couldn't verify this reset link. Please request a new password reset email.",
                "error"
              );

            }

          },
          1000
        );

      } catch (error) {

        console.error(
          "Reset page initialization failed:",
          error
        );

        showMessage(
          "We couldn't verify this reset link. Please request a new password reset email.",
          "error"
        );

      }

    }


    /* =========================================
       START PAGE INITIALIZATION
    ========================================= */

    initializeResetPage();


    /* =========================================
       UPDATE PASSWORD
    ========================================= */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        /*
          Never attempt updateUser()
          without a recovery session.
        */

        if (
          !recoverySessionReady
        ) {

          showMessage(
            "Your reset session is not ready yet. Please open the reset link from your email again.",
            "error"
          );

          return;

        }


        const password =
          passwordInput.value.trim();

        const confirmPassword =
          confirmPasswordInput.value.trim();


        /* =====================================
           VALIDATE PASSWORD
        ===================================== */

        if (
          password.length < 6
        ) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          passwordInput.focus();

          return;

        }


        /* =====================================
           CONFIRM PASSWORD
        ===================================== */

        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          confirmPasswordInput.focus();

          return;

        }


        /* =====================================
           UPDATE PASSWORD
        ===================================== */

        setLoading(true);

        message.className =
          "message";


        try {

          const {
            error
          } =
            await supabaseClient.auth
              .updateUser({
                password:
                  password
              });


          if (error) {

            throw error;

          }


          /* ===================================
             SUCCESS
          =================================== */

          showMessage(
            "Password updated successfully. Redirecting you to login...",
            "success"
          );


          form.reset();


          /*
            Give the user a moment to see
            the success message.
          */

          setTimeout(
            () => {

              window.location.href =
                "/login/";

            },
            2500
          );


        } catch (error) {

          console.error(
            "Password update failed:",
            error
          );


          showMessage(
            error.message ||
            "Unable to update your password. Please try again.",
            "error"
          );


        } finally {

          setLoading(false);

        }

      }
    );

  </script>

</body>
</html>
