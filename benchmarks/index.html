  <script>

    /* =======================================================
       MOBILE NAVIGATION
       ======================================================= */

    const mobileMenuButton =
      document.getElementById("mobileMenuButton");

    const mobileNav =
      document.getElementById("mobileNav");


    if (mobileMenuButton && mobileNav) {

      mobileMenuButton.addEventListener(
        "click",
        function () {

          const isOpen =
            mobileMenuButton.getAttribute(
              "aria-expanded"
            ) === "true";


          mobileMenuButton.setAttribute(
            "aria-expanded",
            String(!isOpen)
          );


          mobileNav.classList.toggle(
            "open",
            !isOpen
          );

        }
      );


      mobileNav
        .querySelectorAll("a")
        .forEach(function (link) {

          link.addEventListener(
            "click",
            function () {

              mobileMenuButton.setAttribute(
                "aria-expanded",
                "false"
              );

              mobileNav.classList.remove(
                "open"
              );

            }
          );

        });

    }


    /* =======================================================
       EVP ANIMATED STATUS TICKER
       ======================================================= */

    const evpMessages = [

      {
        primary: "EVP.AUREON IS LIVE",
        action: "TRY THE EVALUATOR",
        href: "/app/"
      },

      {
        primary: "EVP.AUREON",
        action: "06 EVALUATION DIMENSIONS",
        href: "#new-benchmark"
      },

      {
        primary: "GENERAL QUALITY",
        action: "BENCHMARK READY",
        href: "#new-benchmark"
      },

      {
        primary: "EVALLOOP AI",
        action: "BUILDING BENCHMARK INFRASTRUCTURE",
        href: "#new-benchmark"
      }

    ];


    const evpTrack =
      document.getElementById(
        "evpStatusTrack"
      );

    const evpPrimary =
      document.getElementById(
        "evpStatusPrimary"
      );

    const evpAction =
      document.getElementById(
        "evpStatusAction"
      );

    const evpCounter =
      document.getElementById(
        "evpStatusCounter"
      );


    let evpIndex = 0;


    function changeEvpMessage() {

      if (!evpTrack) {
        return;
      }


      evpTrack.classList.add(
        "changing"
      );


      setTimeout(function () {

        evpIndex =
          (evpIndex + 1) %
          evpMessages.length;


        const message =
          evpMessages[evpIndex];


        evpPrimary.textContent =
          message.primary;


        evpAction.textContent =
          message.action;


        evpAction.href =
          message.href;


        evpCounter.textContent =
          String(evpIndex + 1).padStart(2, "0")
          + " / "
          + String(evpMessages.length).padStart(2, "0");


        evpTrack.classList.remove(
          "changing"
        );

      }, 350);

    }


    if (
      !window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches
    ) {

      setInterval(
        changeEvpMessage,
        3500
      );

    }


    /* =======================================================
       BENCHMARK SELECTION
       ======================================================= */

    const benchmarkSelect =
      document.getElementById(
        "benchmarkSelect"
      );

    const summaryBenchmark =
      document.getElementById(
        "summaryBenchmark"
      );


    document
      .querySelectorAll(
        "[data-benchmark]"
      )
      .forEach(function (button) {

        button.addEventListener(
          "click",
          function () {

            const name =
              button.dataset.benchmark;


            if (benchmarkSelect) {

              benchmarkSelect.value =
                name;

            }


            if (summaryBenchmark) {

              summaryBenchmark.textContent =
                name.toUpperCase();

            }


            const builder =
              document.getElementById(
                "new-benchmark"
              );


            if (builder) {

              builder.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

            }

          }
        );

      });


    /* =======================================================
       BENCHMARK SELECT
       ======================================================= */

    if (benchmarkSelect) {

      benchmarkSelect.addEventListener(
        "change",
        function () {

          if (summaryBenchmark) {

            summaryBenchmark.textContent =
              benchmarkSelect.value.toUpperCase();

          }

        }
      );

    }


    /* =======================================================
       TEST SIZE
       ======================================================= */

    const sizeInputs =
      document.querySelectorAll(
        'input[name="testSize"]'
      );

    const summarySize =
      document.getElementById(
        "summarySize"
      );


    sizeInputs.forEach(
      function (input) {

        input.addEventListener(
          "change",
          function () {

            if (summarySize) {

              summarySize.textContent =
                input.value;

            }

          }
        );

      }
    );


    /* =======================================================
       DIMENSION COUNT
       ======================================================= */

    const dimensionInputs =
      document.querySelectorAll(
        ".dimension-option input"
      );

    const summaryDimensions =
      document.getElementById(
        "summaryDimensions"
      );


    function updateDimensionCount() {

      let count = 0;


      dimensionInputs.forEach(
        function (input) {

          if (input.checked) {
            count++;
          }

        }
      );


      if (summaryDimensions) {

        summaryDimensions.textContent =
          String(count).padStart(2, "0");

      }

    }


    dimensionInputs.forEach(
      function (input) {

        input.addEventListener(
          "change",
          updateDimensionCount
        );

      }
    );


    /* =======================================================
       BENCHMARK RUNNER
       ======================================================= */

    const runButton =
      document.getElementById(
        "runBenchmark"
      );

    const runSummaryTitle =
      document.getElementById(
        "runSummaryTitle"
      );

    const runNote =
      document.getElementById(
        "runNote"
      );

    const builderStatus =
      document.getElementById(
        "builderStatus"
      );

    const resultsEmpty =
      document.getElementById(
        "resultsEmpty"
      );

    const resultsContent =
      document.getElementById(
        "resultsContent"
      );

    const resultTitle =
      document.getElementById(
        "resultTitle"
      );

    const resultMeta =
      document.getElementById(
        "resultMeta"
      );

    const overallScore =
      document.getElementById(
        "overallScore"
      );

    const overallCopy =
      document.getElementById(
        "overallCopy"
      );

    const historyBody =
      document.getElementById(
        "historyBody"
      );


    let benchmarkRunCount = 0;


    function formatScore(value) {

      const number =
        Number(value);


      if (!Number.isFinite(number)) {
        return "—";
      }


      return number.toFixed(1);

    }


    function findDimensionScore(
      dimensionScores,
      dimensionName
    ) {

      if (!dimensionScores) {
        return null;
      }


      if (
        Object.prototype.hasOwnProperty.call(
          dimensionScores,
          dimensionName
        )
      ) {

        return dimensionScores[
          dimensionName
        ];

      }


      const target =
        dimensionName
          .toLowerCase()
          .replace(/[\s_-]+/g, "");


      const key =
        Object.keys(
          dimensionScores
        ).find(function (candidate) {

          return candidate
            .toLowerCase()
            .replace(/[\s_-]+/g, "")
            === target;

        });


      if (key) {

        return dimensionScores[key];

      }


      return null;

    }


    function updateResultMetrics(
      dimensionScores
    ) {

      document
        .querySelectorAll(
          ".result-metric-score"
        )
        .forEach(function (scoreElement) {

          const dimension =
            scoreElement.dataset.dimension;


          const score =
            findDimensionScore(
              dimensionScores,
              dimension
            );


          if (score === null) {

            scoreElement.textContent =
              "—";

          } else {

            scoreElement.textContent =
              formatScore(score);

          }

        });

    }


    function addHistoryRow(
      benchmark,
      testSize,
      overall
    ) {

      if (!historyBody) {
        return;
      }


      benchmarkRunCount++;


      const date =
        new Date().toLocaleString(
          undefined,
          {
            year: "numeric",
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      const row =
        document.createElement("tr");


      row.innerHTML = `
        <td>RUN #${String(benchmarkRunCount).padStart(3, "0")}</td>
        <td>${benchmark}</td>
        <td>${testSize}</td>
        <td>${formatScore(overall)}</td>
        <td>COMPLETED</td>
        <td>${date}</td>
      `;


      const placeholder =
        historyBody.querySelector(
          ".history-placeholder"
        );


      if (placeholder) {

        historyBody.innerHTML = "";

      }


      historyBody.prepend(row);

    }


    function showBenchmarkError(
      message
    ) {

      if (runSummaryTitle) {

        runSummaryTitle.textContent =
          "Benchmark failed";

      }


      if (runNote) {

        runNote.textContent =
          message;

      }


      if (builderStatus) {

        builderStatus.textContent =
          "● ERROR";

        builderStatus.style.color =
          "var(--muted)";

      }

    }


    if (runButton) {

      runButton.addEventListener(
        "click",
        async function () {

          const benchmark =
            benchmarkSelect
              ? benchmarkSelect.value
              : "General Quality";


          const modelInput =
            document.getElementById(
              "modelName"
            );


          const model =
            modelInput
              ? modelInput.value.trim()
              : "";


          const selectedSize =
            document.querySelector(
              'input[name="testSize"]:checked'
            );


          const testSize =
            selectedSize
              ? Number(selectedSize.value)
              : 10;


          const dimensions =
            Array.from(
              document.querySelectorAll(
                ".dimension-option input:checked"
              )
            ).map(function (input) {

              return input.value;

            });


          if (!model) {

            if (runSummaryTitle) {

              runSummaryTitle.textContent =
                "Model name required";

            }


            if (runNote) {

              runNote.textContent =
                "Enter a system or model name before running the benchmark.";

            }


            if (modelInput) {

              modelInput.focus();

            }


            return;

          }


          if (!dimensions.length) {

            if (runSummaryTitle) {

              runSummaryTitle.textContent =
                "Select a dimension";

            }


            if (runNote) {

              runNote.textContent =
                "Select at least one evaluation dimension before running the benchmark.";

            }


            return;

          }


          runButton.disabled = true;

          runButton.style.opacity =
            ".65";


          runButton.innerHTML =
            "RUNNING…";


          if (runSummaryTitle) {

            runSummaryTitle.textContent =
              "Running benchmark";

          }


          if (runNote) {

            runNote.textContent =
              "Sending the configured benchmark to the EvalLoop AI benchmark engine…";

          }


          if (builderStatus) {

            builderStatus.textContent =
              "● RUNNING";

            builderStatus.style.color =
              "var(--green)";

          }


          try {

            const response =
              await fetch(
                "/api/benchmark",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    benchmark:
                      benchmark,

                    model:
                      model,

                    testSize:
                      testSize,

                    dimensions:
                      dimensions
                  })
                }
              );


            let data = null;


            try {

              data =
                await response.json();

            } catch (jsonError) {

              throw new Error(
                "The benchmark server returned an invalid response."
              );

            }


            if (
              !response.ok ||
              !data ||
              data.success !== true
            ) {

              throw new Error(
                data &&
                data.error
                  ? data.error
                  : "Benchmark execution failed."
              );

            }


            /*
             * Successful benchmark result.
             */


            if (resultsEmpty) {

              resultsEmpty.style.display =
                "none";

            }


            if (resultsContent) {

              resultsContent.classList.add(
                "visible"
              );

            }


            if (resultTitle) {

              resultTitle.textContent =
                data.benchmark ||
                benchmark;

            }


            if (resultMeta) {

              resultMeta.textContent =
                "RUN #"
                + String(
                    benchmarkRunCount + 1
                  ).padStart(3, "0")
                + " · "
                + String(
                    data.testSize ||
                    testSize
                  )
                + " TESTS";

            }


            if (overallScore) {

              overallScore.textContent =
                formatScore(
                  data.overall
                );

            }


            if (overallCopy) {

              overallCopy.textContent =
                (data.model || model)
                + " · "
                + (data.engine ||
                   "EVP.Aureon");

            }


            updateResultMetrics(
              data.dimensionScores
            );


            addHistoryRow(
              data.benchmark ||
                benchmark,

              data.testSize ||
                testSize,

              data.overall
            );


            if (runSummaryTitle) {

              runSummaryTitle.textContent =
                "Benchmark complete";

            }


            if (runNote) {

              runNote.textContent =
                data.note ||
                "Benchmark completed successfully.";

            }


            if (builderStatus) {

              builderStatus.textContent =
                "● COMPLETE";

              builderStatus.style.color =
                "var(--green)";

            }


            if (resultsContent) {

              resultsContent.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

            }

          } catch (error) {

            console.error(
              "Benchmark error:",
              error
            );


            showBenchmarkError(
              error &&
              error.message
                ? error.message
                : "Unable to run the benchmark. Please try again."
            );

          } finally {

            runButton.disabled =
              false;


            runButton.style.opacity =
              "1";


            runButton.innerHTML =
              'RUN BENCHMARK <span>→</span>';

          }

        }
      );

    }


    /* =======================================================
       REVEAL ANIMATION
       ======================================================= */

    const revealElements =
      document.querySelectorAll(
        ".reveal"
      );


    if (
      "IntersectionObserver" in window
    ) {

      const revealObserver =
        new IntersectionObserver(
          function (entries) {

            entries.forEach(
              function (entry) {

                if (
                  entry.isIntersecting
                ) {

                  entry.target.classList.add(
                    "visible"
                  );


                  revealObserver.unobserve(
                    entry.target
                  );

                }

              }
            );

          },
          {
            threshold: .08
          }
        );


      revealElements.forEach(
        function (element) {

          revealObserver.observe(
            element
          );

        }
      );

    } else {

      revealElements.forEach(
        function (element) {

          element.classList.add(
            "visible"
          );

        }
      );

    }

  </script>
